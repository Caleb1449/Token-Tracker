<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=no">
    <title>MTG Token & Counter Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="tracker-container">
        <h1>MTG Token Tracker</h1>
        
        <!-- Mobile-friendly controls panel -->
        <div class="controls-panel">
            <div class="input-row">
                <input type="text" id="tokenName" placeholder="Name (e.g., Angel)">
                <div class="pt-inputs">
                    <input type="text" id="tokenPower" placeholder="P">
                    <span class="slash">/</span>
                    <input type="text" id="tokenToughness" placeholder="T">
                </div>
            </div>
            
            <div class="input-row-secondary">
                <input type="text" id="tokenKeywords" placeholder="Keywords (Flying, Haste...)">
                <input type="number" id="tokenQty" value="1" min="1">
                <button id="addTokenBtn">Add</button>
            </div>
            
            <div class="options-row">
                <label>
                    <input type="radio" name="layoutType" value="separate" checked> Separate
                </label>
                <label>
                    <input type="radio" name="layoutType" value="stacked"> Stacked
                </label>
            </div>

            <!-- Global actions panel broken into separate, clear rows -->
            <div class="global-actions">
                <button id="untapAllBtn" class="action-btn untap-btn">↩️ Untap All Tokens</button>
                <button id="removeAllBtn" class="action-btn remove-all-btn">💥 Remove All Tokens</button>
            </div>
        </div>

        <!-- Board Area where tokens appear -->
        <div id="battlefield" class="battlefield-grid"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
